<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
  <head>
    <title>Boletim da Turma</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="shortcut icon" href="assets/boletim.png" type="image/png" />
  </head>

  <body>
    <header class="mb-5">
      <nav class="navbar bg-info-subtle">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">
            <img
              src="assets/boletim (1).png"
              alt="Logo"
              width="30"
              height="24"
              class="d-inline-block align-text-top"
            />
            Boletim da Turma
          </a>
        </div>
      </nav>
    </header>
    <main class="container w-50">
      <form id="form-aluno" class="row g-2" novalidate>
        <input
          id="nome"
          class="form-control"
          aria-label="Nome do aluno"
          placeholder="Nome"
        />
        <input
          id="nota1"
          inputmode="decimal"
          class="form-control"
          aria-label="Nota 1"
          placeholder="Nota 1"
        />
        <input
          id="nota2"
          inputmode="decimal"
          class="form-control"
          aria-label="Nota 2"
          placeholder="Nota 2"
        />
        <button class="btn btn-primary">Adicionar</button>
      </form>
      <p id="mensagem" class="text-danger" aria-live="polite"></p>

      <table class="table">
        <thead>
          <tr>
            <th>Aluno</th>
            <th>Média</th>
            <th>Situação</th>
          </tr>
        </thead>
        <tbody id="tabela-alunos"></tbody>
      </table>
      <p id="resumo" class="fw-bold"></p>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
